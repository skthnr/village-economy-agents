[workspace]
resolver = "3"
members = ["contracts/world", "contracts/items", "contracts/coin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-sdk-contract-tools = "=4.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
